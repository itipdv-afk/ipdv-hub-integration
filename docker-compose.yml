services:

  # Ejecuta la sincronización completa una vez y termina
  cron:
    build: .
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: "no"
    command: python cron.py

  # Servidor webhook — se mantiene activo esperando eventos de PCO
  webhook:
    build: .
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8080 --workers 1 --timeout 120 webhook:app
